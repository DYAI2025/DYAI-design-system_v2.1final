<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LanguageSwitch — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<style>
  body { min-width: 0; }
  body::before { display: none; }
  .pv { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; padding: 24px; }
  .pv--dark { background: var(--graphite); }
  .pv--col { flex-direction: column; align-items: flex-start; gap: 14px; }
  
</style>
</head>
<body>
<div class="pv"><div class="language-switch" role="group" aria-label="Language"><button type="button" aria-pressed="true" lang="en">EN</button><button type="button" aria-pressed="false" lang="de">DE</button></div><div class="language-switch" role="group" aria-label="Sprache"><button type="button" aria-pressed="false" lang="en">EN</button><button type="button" aria-pressed="true" lang="de">DE</button></div></div>
</body>
</html>
